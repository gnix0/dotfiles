# Ashen Pure Black for Alacritty
# Based on Ashen by Daniel Fichtinger (MIT License)
# Source: https://github.com/ficd0/ashen/blob/main/alacritty/ashen.toml
# Adaptation: foundational backgrounds changed from #121212 to #000000.

[colors.primary]
background = '#000000'
foreground = '#f5f5f5'

[colors.cursor]
cursor = '#f5f5f5'
